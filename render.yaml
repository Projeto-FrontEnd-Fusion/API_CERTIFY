services:
  - type: web
    name: certify-api
    runtime: python
    branch: main
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: pip install poetry==2.5.1 && poetry install --only main --no-interaction
    startCommand: poetry run uvicorn api_certify.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: DB_URL
        sync: false
      - key: POETRY_VIRTUALENVS_CREATE
        value: 'false'
      - key: DB_NAME
        value: CERTIFY
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_KEY
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_WORKER_ENABLED
        value: 'true'
      - key: SMTP_HOST
        value: ''
      - key: SMTP_FROM
        value: ''
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURITY
        value: starttls
