name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: '2.5.1'
  POETRY_VIRTUALENVS_CREATE: 'false'
  DB_URL: mongodb://127.0.0.1:27017
  DB_NAME: certify_ci
  SECRET_KEY: ci-only-signing-key-not-for-production-0123456789
  ACCESS_KEY: ci-only-certificate-key
  SMTP_HOST: ''

jobs:
  tests:
    name: Python ${{ matrix.python }} / lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: poetry.lock
      - name: Install locked dependencies
        run: |
          python -m pip install "poetry==$POETRY_VERSION"
          poetry check --lock
          poetry install --with dev --no-interaction
      - name: Check Python correctness
        run: poetry run ruff check --select E9,F api_certify tests scripts
      - name: Unit and integration tests with coverage
        run: |
          mkdir -p artifacts
          poetry run pytest -q --junitxml=artifacts/pytest.xml --cov=api_certify --cov-fail-under=85 --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-tests-python-${{ matrix.python }}
          path: artifacts/
          retention-days: 14

  api-contract:
    name: HTTP contract / Postman and MongoDB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: poetry.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install API and Postman CLI
        run: |
          python -m pip install "poetry==$POETRY_VERSION"
          poetry install --only main --no-interaction
          npm install --global postman-cli@1.69.0
      - name: Start isolated API
        run: |
          mkdir -p artifacts
          poetry run uvicorn api_certify.main:app --host 127.0.0.1 --port 8000 > artifacts/api.log 2>&1 &
          python scripts/wait_for_http.py http://127.0.0.1:8000/ready
      - name: Run HTTP contract assertions
        run: >-
          postman collection run postman/Certify-Local.postman_collection.json
          --env-var server_url=http://127.0.0.1:8000
          --env-var access_key_system=ci-only-certificate-key
          --no-report-events --bail --timeout-request 15000
          --output artifacts/postman
      - name: Upload contract reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-http-contract
          path: artifacts/
          retention-days: 7

  security:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit locked runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          mkdir -p artifacts
          python scripts/export_audit_requirements.py > artifacts/requirements.txt
          pip-audit --no-deps --disable-pip -r artifacts/requirements.txt --format json --output artifacts/dependency-audit.json
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-dependency-audit
          path: artifacts/
          retention-days: 7

  ci:
    name: Backend CI passed
    if: always()
    needs: [tests, api-contract, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all gates
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          API_RESULT: ${{ needs.api-contract.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "$TESTS_RESULT" = success && test "$API_RESULT" = success && test "$SECURITY_RESULT" = success
