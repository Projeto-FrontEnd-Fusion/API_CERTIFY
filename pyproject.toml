[tool.poetry]
name = "api-certify"
version = "0.1.0"
description = "API for certificate management"
authors = ["dinho <claudiosilva.one@gmail.com>"]
readme = "README.md"
packages = [{ include = "api_certify" }]

[tool.poetry.dependencies]
python = "^3.11"

fastapi = "^0.143.0"
uvicorn = "^0.54.0"

python-dotenv = "^1.2.4"

motor = "^3.7.1"
pymongo = "^4.18.3"
motor-types = "^1.0.0b4"

pydantic = { extras = ["email"], version = "^2.12.2" }

passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "5.0.0"

httpx = "^0.28.1"
asgi-lifespan = "^2.1.0"
fastapi-lifespan-manager = "^0.1.4"

mongomock-motor = "^0.0.36"
aiofiles = "^25.1.0"
python-multipart = "^0.0.32"
pyjwt = {extras = ["crypto"], version = "^2.15.1"}

[tool.poetry.group.dev.dependencies]

pytest = ">=8.4.2,<10.0.0"
pytest-asyncio = "^1.3.0"
pytest-cov = ">=4.1,<8.0"
pytest-mock = "^3.15.1"

ruff = ">=0.14,<0.17"

taskipy = "^1.14.1"

mongomock = "^4.3.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["F", "E", "W", "PL", "PT"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-p no:warnings"

[tool.coverage.run]
branch = true
omit = [
    "api_certify/repositories/*",
    "api_certify/core/database/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.taskipy.tasks]
lint = "ruff check"
format = "ruff format"
pre_format = "ruff check --fix"

run = "uvicorn api_certify.main:app --reload"

pre_test = "task lint"
test = "pytest -s -x --cov=api_certify -vv"
post_test = "coverage html"